name: Apply Quality-Preserving Power Optimizations

on:
  push:
    paths:
      - 'scripts/apply-power-optimizations.py'
      - '.github/workflows/apply-power-optimizations.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Make cache bump version agnostic
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('scripts/apply-power-optimizations.py')
          s=p.read_text()
          old="""text=text.replace(\"const CACHE = 'card-dungeon-v1.1.6';\",\"const CACHE = 'card-dungeon-v1.1.7';\")
          if text==sw.read_text(): raise SystemExit('sw cache anchor not found')
          sw.write_text(text)
          """
          new="""match=re.search(r\"const CACHE = 'card-dungeon-v(\\d+)\\.(\\d+)\\.(\\d+)';\",text)
          if not match: raise SystemExit('sw cache version not found')
          major,minor,patch=map(int,match.groups())
          text=text[:match.start()]+f\"const CACHE = 'card-dungeon-v{major}.{minor}.{patch+1}';\"+text[match.end():]
          sw.write_text(text)
          """
          if old not in s: raise SystemExit('power patch tail not found')
          p.write_text(s.replace(old,new,1))
          PY
      - name: Apply power optimizations
        run: python3 scripts/apply-power-optimizations.py
      - name: Run tests
        run: npm test
      - name: Validate static build
        run: npm run validate
      - name: Commit optimized runtime
        run: |
          git config user.name 'yz4git'
          git config user.email '65384484+yz4git@users.noreply.github.com'
          git add dist/js/scene.js dist/sw.js scripts/apply-power-optimizations.py
          if git diff --cached --quiet; then
            echo 'No changes to commit'
            exit 0
          fi
          git commit -m 'Reduce idle GPU load without lowering visual quality'
          git push origin HEAD:main
