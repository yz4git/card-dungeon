name: Implement Battle Actor Scene Reaction

on:
  push:
    paths:
      - '.github/workflows/implement-battle-actor-scene.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Patch enemy hit reactions
        run: |
          python - <<'PY'
          from pathlib import Path

          app=Path('dist/js/app.js')
          text=app.read_text()
          old="audio.play(r.damageToPlayer||r.damageToEnemy?'attack':r.healPlayer?'heal':'guard');world?.impact('player',r.damageToPlayer);"
          new="audio.play(r.damageToPlayer||r.damageToEnemy?'attack':r.healPlayer?'heal':'guard');world?.impact('enemy',r.damageToEnemy);world?.impact('player',r.damageToPlayer);"
          if old in text:text=text.replace(old,new,1)
          elif new not in text:raise SystemExit('app impact marker missing')
          app.write_text(text)

          scene=Path('dist/js/scene.js')
          s=scene.read_text()
          old="this.host=host;this.onFallback=onFallback;this.time=0;this.map=null;this.mode='title';this.target=new THREE.Vector3(0,1.55,0);this.angle=0;this.targetAngle=0;this.eventMeshes=[];this.materials=[];"
          new="this.host=host;this.onFallback=onFallback;this.time=0;this.map=null;this.mode='title';this.target=new THREE.Vector3(0,1.55,0);this.angle=0;this.targetAngle=0;this.eventMeshes=[];this.materials=[];this.enemyHit=0;"
          if old in s:s=s.replace(old,new,1)

          old="item.obj.position.set(item.cell.x*TILE+(active?dx*.9:0),1.3,item.cell.z*TILE+(active?dz*.9:0));\n        if(active&&inBattle)item.obj.visible=true;"
          new="item.active=active&&inBattle;item.baseX=item.cell.x*TILE+(active?dx*.9:0);item.baseZ=item.cell.z*TILE+(active?dz*.9:0);item.obj.position.set(item.baseX,1.3,item.baseZ);\n        if(active&&inBattle)item.obj.visible=true;"
          if old in s:s=s.replace(old,new,1)
          elif new not in s:raise SystemExit('scene active marker missing')

          old="impact(who,damage){this.shake=who==='player'&&damage>0?.12:.025;this.hitTime=performance.now();}"
          new="impact(who,damage){if(who==='enemy'&&damage>0){this.enemyHit=Math.min(.34,.10+damage*.006);this.hitTime=performance.now();return;}this.shake=who==='player'&&damage>0?.12:.025;this.hitTime=performance.now();}"
          if old in s:s=s.replace(old,new,1)
          elif new not in s:raise SystemExit('scene impact marker missing')

          old="for(const item of this.eventMeshes)if(item.kind==='enemy'&&item.obj.visible)item.obj.position.y=1.3+Math.sin(this.time*1.8+item.cell.x)*.025;"
          new="for(const item of this.eventMeshes)if(item.kind==='enemy'&&item.obj.visible){const hit=item.active?(this.enemyHit||0):0;item.obj.position.x=(item.baseX??item.obj.position.x)+Math.sin(now*.19)*hit;item.obj.position.z=item.baseZ??item.obj.position.z;item.obj.position.y=1.3+Math.sin(this.time*1.8+item.cell.x)*.025+Math.abs(Math.sin(now*.14))*hit*.16;const sx=2.65*(1+hit*.12),sy=2.65*(1-hit*.08);item.obj.scale.set(sx,sy,1);}this.enemyHit=(this.enemyHit||0)*.72;"
          if old in s:s=s.replace(old,new,1)
          elif new not in s:raise SystemExit('scene enemy tick marker missing')
          scene.write_text(s)
          PY
      - name: Commit source changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/js/app.js dist/js/scene.js
          git diff --cached --quiet && exit 0
          git commit -m "Add enemy sprite hit reactions"
          git push origin HEAD:main
