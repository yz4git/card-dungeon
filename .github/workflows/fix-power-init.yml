name: Fix Power Scheduler Init Order

on:
  push:
    paths:
      - 'scripts/fix-power-init.py'
      - '.github/workflows/fix-power-init.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply init-order fix
        run: python3 scripts/fix-power-init.py
      - name: Run tests
        run: npm test
      - name: Validate static build
        run: npm run validate
      - name: Commit fix
        run: |
          git config user.name 'yz4git'
          git config user.email '65384484+yz4git@users.noreply.github.com'
          git add dist/js/scene.js scripts/apply-power-optimizations.py
          git commit -m 'Fix power scheduler initialization order'
          git push origin HEAD:main
