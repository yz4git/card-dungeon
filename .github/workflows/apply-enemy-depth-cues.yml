name: Apply Enemy Depth Cues

on:
  push:
    paths:
      - '.github/workflows/apply-enemy-depth-cues.yml'
      - 'scripts/apply-enemy-depth-cues.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
      - name: Apply depth cue patch
        run: python scripts/apply-enemy-depth-cues.py
      - name: Run tests
        run: npm test
      - name: Validate static build
        run: npm run validate
      - name: Commit changes
        run: |
          git config user.name "yz4git"
          git config user.email "65384484+yz4git@users.noreply.github.com"
          git add dist/js/scene.js dist/sw.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Improve enemy tile depth readability"
          git push
