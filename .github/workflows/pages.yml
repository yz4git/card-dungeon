name: Deploy Card Dungeon to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Prepare fresh Pages artifact
        env:
          BUILD_SHA: ${{ github.sha }}
        run: |
          rm -rf _site
          cp -a dist _site
          python - <<'PY'
          import os
          from pathlib import Path

          sha = os.environ['BUILD_SHA'][:12]

          # Keep the five-card planning rules unchanged, but give each resolved turn
          # enough screen time to be understood on a phone before the next turn fires.
          app = Path('_site/js/app.js')
          js = app.read_text(encoding='utf-8')
          pacing_replacements = [
              ('scheduleTurn(450);', 'scheduleTurn(700);'),
              ('function scheduleTurn(delay=1050/speed){', 'function scheduleTurn(delay=2300/speed){'),
              ("}},700/speed);return;", "}},1550/speed);return;"),
          ]
          for old, new in pacing_replacements:
              count = js.count(old)
              if count != 1:
                  raise SystemExit(f'Expected exactly one pacing marker {old!r}, found {count}')
              js = js.replace(old, new, 1)
          app.write_text(js, encoding='utf-8')

          # Portrait exploration uses a real 16:9 renderer and matching CSS window.
          # Preserve the power-optimized no-op resize guard and wake scheduling.
          scene = Path('_site/js/scene.js')
          scene_js = scene.read_text(encoding='utf-8')
          size_old = "if(width===this.width&&height===this.height)return;\n    this.width=width;this.height=height;\n    if(this.fallback){const ratio=Math.min(devicePixelRatio||1,1.5);this.canvas.width=width*ratio;this.canvas.height=height*ratio;this.wake(900);return;}\n    this.renderer.setSize(width,height,false);this.camera.aspect=width/height;this.camera.fov=height>width?70:65;this.camera.updateProjectionMatrix();this.wake(900);"
          size_new = "if(width===this.width&&height===this.height)return;\n    this.width=width;this.height=height;\n    const portraitExplore=height>width&&this.mode==='explore',renderHeight=portraitExplore?Math.max(1,Math.round(width*9/16)):height;this.renderHeight=renderHeight;\n    if(this.fallback){const ratio=Math.min(devicePixelRatio||1,1.5);this.canvas.width=width*ratio;this.canvas.height=renderHeight*ratio;this.wake(900);return;}\n    this.renderer.setSize(width,renderHeight,false);this.camera.aspect=width/renderHeight;this.camera.fov=portraitExplore?80:(height>width?70:65);this.camera.updateProjectionMatrix();this.wake(900);"
          tick_old = "this.camera.position.lerp(this.target,smooth);this.camera.rotation.y=this.angle;"
          tick_new = "const desired=this._cameraTarget||(this._cameraTarget=new THREE.Vector3());desired.copy(this.target);if(this.mode==='explore'&&this.height>this.width){const back=.42;desired.x+=Math.sin(this.angle)*back;desired.z+=Math.cos(this.angle)*back;}this.camera.position.lerp(desired,smooth);this.camera.rotation.y=this.angle;"
          fallback_old = "const a=-this.angle+(i/w-.5)*1.15;let d=.03;"
          fallback_new = "const raySpread=(this.mode==='explore'&&this.height>this.width)?1.95:1.15,a=-this.angle+(i/w-.5)*raySpread;let d=.03;"
          fallback_cos_old = "const hh=Math.min(h,h/(d*Math.cos((i/w-.5)*1.15)*1.5)),shade=Math.max(19,85-d*12);"
          fallback_cos_new = "const hh=Math.min(h,h/(d*Math.cos((i/w-.5)*raySpread)*1.5)),shade=Math.max(19,85-d*12);"
          for old, new in [(size_old,size_new),(tick_old,tick_new),(fallback_old,fallback_new),(fallback_cos_old,fallback_cos_new)]:
              count = scene_js.count(old)
              if count != 1:
                  raise SystemExit(f'Expected exactly one scene marker, found {count}: {old[:80]!r}')
              scene_js = scene_js.replace(old, new, 1)
          scene.write_text(scene_js, encoding='utf-8')

          index = Path('_site/index.html')
          html = index.read_text(encoding='utf-8')
          assets = [
              './manifest.webmanifest',
              './style.css',
              './enhancements.css',
              './cinematic.css',
              './wide-dungeon.css',
              './battle-planning.css',
              './portrait-hand-fix.css',
              './battle-polish.css',
              './card-focus.css',
              './battle-actor-fx.css',
              './encounter-transition.css',
              './victory-transition.css',
              './explore-toast-position.css',
              './late-game.css',
              './visual-cleanup.css',
              './js/app.js',
              './js/enhancements.js',
              './js/cinematic.js',
              './js/battle-planning.js',
              './js/battle-polish.js',
              './js/battle-actor-fx.js',
              './js/encounter-transition.js',
              './js/victory-transition.js',
              './js/late-game.js',
              './js/deck-advisor.js',
              './js/scene.js',
          ]
          for asset in assets:
              html = html.replace(asset, f'{asset}?v={sha}')
          marker = '<meta name="theme-color" content="#071018">'
          html = html.replace(marker, f'<meta name="build-id" content="{sha}">\n  {marker}', 1)
          index.write_text(html, encoding='utf-8')

          latest = f'''<!doctype html>
          <html lang="ja">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
            <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
            <meta http-equiv="Pragma" content="no-cache">
            <meta http-equiv="Expires" content="0">
            <meta name="theme-color" content="#071018">
            <title>CARD DUNGEON — 最新版を開く</title>
            <style>
              html,body{{margin:0;width:100%;height:100%;background:#071018;color:#e5e4dc;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif}}
              body{{display:grid;place-items:center;text-align:center}}
              main{{padding:28px}}
              b{{display:block;font-size:18px;letter-spacing:1px;margin-bottom:12px}}
              p{{color:#9fb0b7;line-height:1.8;font-size:14px}}
            </style>
          </head>
          <body><main><b>CARD DUNGEON</b><p>最新版の公開データを読み直しています…</p></main>
          <script>
          (async()=>{{
            const build='{sha}';
            try{{
              if('serviceWorker' in navigator){{
                const regs=await navigator.serviceWorker.getRegistrations();
                await Promise.all(regs.filter(r=>r.scope.startsWith(location.origin+location.pathname.replace(/latest\\.html.*$/,''))).map(r=>r.unregister()));
              }}
              if('caches' in window){{
                const keys=await caches.keys();
                await Promise.all(keys.filter(k=>k.startsWith('card-dungeon-')).map(k=>caches.delete(k)));
              }}
            }}catch(e){{}}
            location.replace('./?v='+build);
          }})();
          </script></body></html>'''
          Path('_site/latest.html').write_text(latest, encoding='utf-8')
          PY

      - name: Upload game artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./_site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
