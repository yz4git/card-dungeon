# Battle FX v2 regression trigger
name: Card Dungeon B10 Playcheck

on:
  push:
    paths:
      - '.github/workflows/playcheck-10f.yml'
      - 'dist/index.html'
      - 'dist/sw.js'
      - 'dist/late-game.css'
      - 'dist/js/data.js'
      - 'dist/js/engine.js'
      - 'dist/js/deck-advisor.js'
      - 'dist/js/late-game.js'
      - 'scripts/playcheck-10f.mjs'
      - 'tests/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  playcheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Run unit tests
        run: npm test
      - name: Validate static build
        run: npm run validate
      - name: Play through B10 simulations
        run: node scripts/playcheck-10f.mjs
