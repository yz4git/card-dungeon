name: Enhance Battle FX v2

on:
  push:
    paths:
      - .github/workflows/enhance-battle-fx-v2.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  enhance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Apply battle FX v2
        run: python scripts/apply-battle-fx-v2.py
      - name: Run regression checks
        run: |
          npm test
          npm run validate
      - name: Commit implementation
        run: |
          git config user.name "yz4git"
          git config user.email "65384484+yz4git@users.noreply.github.com"
          git add dist/js/app.js dist/js/battle-actor-fx.js dist/battle-actor-fx.css dist/sw.js
          git commit -m "Enhance battle FX clarity and preserve fifth-turn presentation"
          git push
